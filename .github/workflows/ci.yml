name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Informational: flags PRs missing a changeset without failing the build
      - run: pnpm changeset status --since=origin/main
        continue-on-error: true

      - run: pnpm lint

      - run: pnpm format

      - run: pnpm typecheck

      - run: pnpm build

      - run: pnpm test
